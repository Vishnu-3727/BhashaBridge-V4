name: CI

# Lightweight gate: compile the debug variant and run the hermetic JVM unit tests.
# Instrumented tests, benchmarks, and baseline-profile generation need a device and
# the ~610 MB model assets (gitignored), so they are deliberately NOT run here.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Model assets are absent on CI; the build packages an APK without them (they are
      # loaded at runtime, not build time) and the unit tests are hermetic — the one test
      # that reads a real dictionary self-skips via JUnit assumeTrue when it is not staged.
      - name: Build debug + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
